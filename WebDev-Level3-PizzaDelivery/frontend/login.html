<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SliceCraft | Welcome Back</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            display: flex; 
            justify-content: center;
            align-items: center;
            height: 100vh; 
            background-color: #1e272e; 
            overflow: hidden;
        }

        /* Fullscreen Laptop Mockup Background Wrapper */
        .laptop-bg-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('62350.png') no-repeat center center;
            background-size: 100% 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Transparent Login Popup placed exactly over the laptop's right white screen */
        .form-overlay-box {
            position: absolute;
            width: 38%; 
            height: 72%;
            right: 9.5%;
            top: 13.5%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(6px);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 8px;
        }

        .form-box { width: 100%; max-width: 360px; margin: 0 auto; }
        .form-box h2 { font-size: 2rem; color: #2f3542; margin-bottom: 6px; font-weight: 700; text-align: center; }
        .form-box p.subtitle { color: #57606f; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }

        .form-group { margin-bottom: 14px; position: relative; }
        label { display: block; font-weight: 600; margin-bottom: 4px; color: #2f3542; font-size: 0.85rem; }
        
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(205, 214, 224, 0.9);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            transition: 0.2s;
        }

        input:focus { border-color: #ff4757; background: #fff; box-shadow: 0 0 0 3px rgba(255,71,87,0.2); }

        /* Password Eye Toggle Button Styling */
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 40px; }
        .eye-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.1rem;
            color: #57606f;
            user-select: none;
        }

        .form-options {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.8rem;
        }
        .form-options span { color: #ff4757; cursor: pointer; font-weight: 600; }
        .form-options span:hover { text-decoration: underline; }

        .btn-submit {
            background: #ff4757;
            color: #ffffff;
            border: none;
            padding: 11px;
            width: 100%;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(255,71,87,0.3);
        }
        .btn-submit:hover { background: #ff3838; }

        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #2f3542;
        }
        .toggle-link span { color: #ff4757; font-weight: bold; cursor: pointer; text-decoration: underline; }

        /* Inline Message Banners */
        .msg-box {
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 10px;
            padding: 6px;
            border-radius: 4px;
            display: none;
        }
        .msg-error { background: #ffeaa7; color: #d63031; }
        .msg-success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

    <div class="laptop-bg-container">
        <div class="form-overlay-box">
            <div class="form-box">
                
                <!-- Login Form View -->
                <div id="loginBox">
                    <h2>Welcome Back!</h2>
                    <p class="subtitle">Log in to your Pizza account</p>
                    <div id="loginMsg" class="msg-box"></div>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label>Email or Mobile Number</label>
                            <input type="text" id="loginEmail" placeholder="Enter your email or phone" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="loginPassword" placeholder="••••••••" required>
                                <span class="eye-icon" id="toggleLoginPass" onclick="togglePasswordVisibility('loginPassword', 'toggleLoginPass')">👁️‍🗨️</span>
                            </div>
                        </div>

                        <div class="form-options">
                            <span onclick="showForgotView()">Forgot Password?</span>
                        </div>

                        <button type="submit" class="btn-submit">Log In →</button>
                    </form>

                    <div class="toggle-link">
                        Don't have an account? <span onclick="toggleAuth('register')">Sign Up</span>
                    </div>
                </div>

                <!-- Register Form View -->
                <div id="registerBox" style="display: none;">
                    <h2>Create Account</h2>
                    <p class="subtitle">Sign up to start ordering custom pizzas</p>
                    <div id="registerMsg" class="msg-box"></div>
                    
                    <form id="registerForm">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="regName" placeholder="Musaib Sayyed" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="regEmail" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="regPassword" placeholder="Create a strong password" required>
                                <span class="eye-icon" id="toggleRegPass" onclick="togglePasswordVisibility('regPassword', 'toggleRegPass')">👁️‍🗨️</span>
                            </div>
                        </div>

                        <button type="submit" class="btn-submit" style="margin-top: 5px;">Sign Up →</button>
                    </form>

                    <div class="toggle-link">
                        Already have an account? <span onclick="toggleAuth('login')">Log In</span>
                    </div>
                </div>

                <!-- Forgot Password View -->
                <div id="forgotBox" style="display: none;">
                    <h2>Reset Password</h2>
                    <p class="subtitle">Enter your registered email to reset password</p>
                    <div id="forgotMsg" class="msg-box"></div>
                    
                    <form id="forgotForm">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="forgotEmail" placeholder="Enter your email" required>
                        </div>
                        <div class="form-group" id="tokenGroup" style="display: none;">
                            <label>Reset Token (Auto-filled)</label>
                            <input type="text" id="resetToken" placeholder="Paste token here">
                        </div>
                        <div class="form-group" id="newPassGroup" style="display: none;">
                            <label>New Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="newPassword" placeholder="Enter new password">
                                <span class="eye-icon" id="toggleNewPass" onclick="togglePasswordVisibility('newPassword', 'toggleNewPass')">👁️‍🗨️</span>
                            </div>
                        </div>

                        <button type="submit" id="forgotBtn" class="btn-submit">Send Reset Token →</button>
                    </form>

                    <div class="toggle-link">
                        Remember your password? <span onclick="toggleAuth('login')">Log In</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Smart API URL determination for Localhost & Production (Render)
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000/api' 
            : '/api';

        function showMsg(elementId, text, isError = true) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = `msg-box ${isError ? 'msg-error' : 'msg-success'}`;
            el.style.display = 'block';
        }

        function toggleAuth(view) {
            const loginBox = document.getElementById('loginBox');
            const registerBox = document.getElementById('registerBox');
            const forgotBox = document.getElementById('forgotBox');

            document.getElementById('loginMsg').style.display = 'none';
            document.getElementById('registerMsg').style.display = 'none';
            document.getElementById('forgotMsg').style.display = 'none';

            loginBox.style.display = 'none';
            registerBox.style.display = 'none';
            forgotBox.style.display = 'none';

            if (view === 'login') loginBox.style.display = 'block';
            else if (view === 'register') registerBox.style.display = 'block';
            else if (view === 'forgot') forgotBox.style.display = 'block';
        }

        function showForgotView() {
            toggleAuth('forgot');
            document.getElementById('tokenGroup').style.display = 'none';
            document.getElementById('newPassGroup').style.display = 'none';
            document.getElementById('forgotBtn').innerText = 'Send Reset Token →';
            document.getElementById('forgotEmail').value = '';
        }

        // Toggle Password Visibility Function
        function togglePasswordVisibility(fieldId, iconId) {
            const passwordField = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                icon.innerText = '👁️';
            } else {
                passwordField.type = 'password';
                icon.innerText = '👁️‍🗨️';
            }
        }

        let isTokenGenerated = false;

        // Forgot Password Handler
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!isTokenGenerated) {
                const email = document.getElementById('forgotEmail').value;
                try {
                    const res = await fetch(`${API_URL}/auth/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showMsg('forgotMsg', data.message, false);
                        document.getElementById('resetToken').value = data.resetToken;
                        document.getElementById('tokenGroup').style.display = 'block';
                        document.getElementById('newPassGroup').style.display = 'block';
                        document.getElementById('forgotBtn').innerText = 'Update Password →';
                        isTokenGenerated = true;
                    } else {
                        showMsg('forgotMsg', data.error || 'Failed to generate reset token');
                    }
                } catch (err) {
                    console.error(err);
                    showMsg('forgotMsg', 'Server connection error!');
                }
            } else {
                const token = document.getElementById('resetToken').value;
                const newPassword = document.getElementById('newPassword').value;
                try {
                    const res = await fetch(`${API_URL}/auth/reset-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, newPassword })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showMsg('forgotMsg', data.message, false);
                        isTokenGenerated = false;
                        setTimeout(() => toggleAuth('login'), 1500);
                    } else {
                        showMsg('forgotMsg', data.error || 'Password reset failed');
                    }
                } catch (err) {
                    console.error(err);
                    showMsg('forgotMsg', 'Server connection error!');
                }
            }
        });

        // Register Handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('regName').value,
                        email: document.getElementById('regEmail').value,
                        password: document.getElementById('regPassword').value,
                        role: 'user'
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showMsg('registerMsg', 'Registration successful! Please login.', false);
                    setTimeout(() => toggleAuth('login'), 1200);
                } else {
                    showMsg('registerMsg', data.error || 'Registration failed');
                }
            } catch (err) {
                console.error(err);
                showMsg('registerMsg', 'Server connection error during registration!');
            }
        });

        // User Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('name', data.name);
                    localStorage.setItem('role', data.role);
                    // Silent smooth redirect without popups
                    window.location.replace('/dashboard');
                } else {
                    showMsg('loginMsg', data.error || 'Login failed');
                }
            } catch (err) {
                console.error(err);
                showMsg('loginMsg', 'Server connection error during login!');
            }
        });
    </script>
</body>
</html>
